{% extends 'base.html' %}

{% block content %}


<div class="myContent max-w-7xl mx-auto p-8 rounded-2xl bg-white/10 backdrop-blur-sm text-white">

  <h2 class="text-3xl font-bold mb-10 text-center sm:text-left">Create Your Invoice</h2>

  <form action="/generate" method="POST" id="invoice-form" class="space-y-10">

    <!-- Business Info -->
    <div class="space-y-6">
      <div class="space-y-2">
        <label class="block font-semibold">Your Business Name</label>
        <input type="text" name="business_name"
          class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-300"
          placeholder="Enter business name" required>
      </div>

      <div class="flex items-center space-x-3">
        <input type="checkbox" id="vat-toggle" class="h-5 w-5 accent-blue-900">
        <label for="vat-toggle" class="font-semibold">VAT?</label>
      </div>
    </div>

    <!-- Client Name & Date -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <div class="space-y-2">
        <label class="block font-semibold">Client Name</label>
        <input type="text" name="client_name"
          class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-300"
          placeholder="Enter client name" required>
      </div>

      <div class="space-y-2">
        <label class="block font-semibold">Invoice Date</label>
        <input type="date" name="invoice_date"
          class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-300"
          required>
      </div>
    </div>

    <!-- Items -->
    <div>
      <h2 class="text-2xl font-semibold mb-4">Items</h2>

      <div class="rounded-2xl overflow-hidden">
        <table class="w-full" id="items-table">
          <thead>
            <tr class="bg-white/10">
              <th class="p-3 text-left text-sm font-semibold">Description</th>
              <th class="p-3 text-left text-sm font-semibold">Type</th>
              <th class="p-3 text-left text-sm font-semibold">Quantity</th>
              <th class="p-3 text-left text-sm font-semibold">Price</th>
              <th class="p-3 text-left text-sm font-semibold">VAT</th>
              <th class="p-3 text-left text-sm font-semibold">Total</th>
              <th class="p-3"></th>
            </tr>
          </thead>

          <tbody>
            <tr class="bg-gray-100 rounded-xl shadow-inner">
              <!-- Description -->
              <td class="p-2 w-2/5">
                <input type="text" name="item_description[]"
                  class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 border-none"
                  required>
              </td>

              <!-- Type -->
              <td class="p-2 w-1/6">
                <select name="item_type[]"
                  class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner border-none">
                  <option value="goods" selected>Goods</option>
                  <option value="service">Service</option>
                </select>
              </td>

              <!-- Quantity -->
              <td class="p-2 w-1/12">
                <input type="number" step="0.01" name="item_quantity[]"
                  class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner border-none" value="1" min="1"
                  required>
              </td>

              <!-- Price -->
              <td class="p-2 w-32">
                <input type="number" name="item_price[]"
                  class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner border-none" value="0" min="0"
                  step="0.01" required>
              </td>

              <!-- VAT -->
              <td class="p-2 w-32">
                <input type="text" name="item_vat[]"
                  class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner vat-cell border-none" readonly
                  value="0.00">
              </td>

              <!-- Total -->
              <td class="p-2 w-32">
                <input type="text" name="item_total[]"
                  class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner line-total border-none" readonly
                  value="0.00">
              </td>

              <!-- Remove -->
              <td class="p-2 w-10 text-center">
                <button type="button" class="text-red-500 font-bold remove-item">X</button>
              </td>
            </tr>

          </tbody>
        </table>
      </div>

      <div class="flex justify-center lg:justify-end mt-4">
        <button type="button" id="add-item"
          class="px-6 py-2 bg-gray-100 text-blue-900 rounded-xl font-semibold shadow hover:bg-green-300 transition">
          Add Item
        </button>
      </div>
    </div>

    <!-- Summary -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- Total -->
      <div class="lg:col-span-2 space-y-3">
        <label class="block font-semibold">Total</label>
        <input type="text" id="total" name="total"
          class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:ring-2 focus:ring-blue-300"
          readonly value="0">
      </div>

      <!-- Bank Details -->
      <div class="space-y-4">
        <div>
          <label class="block font-semibold text-sm">Account Holder Name</label>
          <input type="text" name="bank_account_holder"
            class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:ring-2 focus:ring-blue-300"
            placeholder="e.g. ACME Ltd">
        </div>

        <div>
          <label class="block font-semibold text-sm">Account Number</label>
          <input type="text" name="bank_account_number"
            class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:ring-2 focus:ring-blue-300"
            placeholder="12345678">
        </div>

        <div>
          <label class="block font-semibold text-sm">Sort Code</label>
          <input type="text" name="bank_sort_code"
            class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner focus:ring-2 focus:ring-blue-300"
            placeholder="12-34-56">
        </div>
      </div>

    </div>

    <!-- Submit -->
    <div class="flex justify-center">
      <button type="submit"
        class="px-10 py-3 bg-gray-100 text-blue-900 rounded-xl font-semibold shadow hover:bg-green-300 transition">
        Generate PDF
      </button>
    </div>

  </form>
</div>

{% endblock %}

{% block scripts %}
<script src="http://127.0.0.1:5000/livereload.js"></script>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

{% endblock %}
