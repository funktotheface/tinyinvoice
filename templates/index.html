{% extends 'base.html' %}

    {% block content %}
       <div id="particles-js"></div>


    <div class="myContent max-w-8xl mx-auto rounded-2xl bg-white/6 backdrop-blur-[3px] backdrop-saturate-150 text-white p-8">
      <h2 class="text-3xl font-bold mb-8 text-center sm:text-left">Create Your Invoice</h2>

      <form action="/generate" method="POST" id="invoice-form" class="space-y-6">

        <!-- Business Info -->
        <div class="space-y-4">
          <label class="block font-semibold">Your Business Name</label>
          <input type="text" name="business_name" class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter business name" required>

          <div class="flex items-center space-x-3">
            <input type="checkbox" id="vat-toggle" class="h-5 w-5 accent-blue-900">
            <label for="vat-toggle" class="font-semibold text-white">VAT?</label>
          </div>
        </div>

<div class="space-y-4 sm:flex sm:space-x-4 sm:space-y-0">
  <div class="flex-1 space-y-2">
    <label class="block font-semibold">Client Name</label>
    <input type="text" name="client_name"
           class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300"
           placeholder="Enter client name" required>
  </div>
  <div class="flex-1 space-y-2">
    <label class="block font-semibold">Invoice Date</label>
    <input type="date" name="invoice_date"
           class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300"
           required>
  </div>
</div>

        <!-- Items Table -->
        <h2 class="text-2xl font-semibold mb-4 text-white">Items</h2>
        <div class="overflow-hidden rounded-2xl p-0">
          <table class="w-full mb-0" id="items-table">
            <thead class="rounded-t-xl">
              <tr class="rounded-2xl">
                <th class="text-left p-2">Description</th>
                <th class="text-left p-2">Type</th>
                <th class="text-left p-2">Quantity</th>
                <th class="text-left p-2">Price</th>
                <th class="text-left p-2">VAT</th>
                <th class="text-left p-2">Total</th>
                <th class="p-2"></th>
              </tr>
            </thead>
            <tbody>
              <tr class="bg-gray-100 rounded-xl shadow-inner">
                <td class="first:rounded-l-xl last:rounded-r-xl p-2"><input type="text" name="item_description[]" class="border-none p-2 rounded-xl w-full bg-gray-100 text-blue-900 placeholder-blue-400 shadow-inner" required></td>
                <td>
                  <select name="item_type[]" class="border-none p-2 rounded-xl w-full bg-gray-100 text-blue-900 shadow-inner">
                    <option value="goods" selected>Goods</option>
                    <option value="service">Service</option>
                  </select>
                </td>
                <td><input type="number" name="item_quantity[]" class="border-none p-2 rounded-xl w-full bg-gray-100 text-blue-900 shadow-inner" value="1" min="1" required></td>
                <td><input type="number" name="item_price[]" class="border-none p-2 rounded-xl w-full bg-gray-100 text-blue-900 shadow-inner" value="0" min="0" step="0.01" required></td>
                <td><input type="text" name="item_vat[]" class="border-none p-2 rounded-xl w-full vat-cell bg-gray-100 text-blue-900 shadow-inner" readonly value="0.00"></td>
                <td><input type="text" name="item_total[]" class="border-none p-2 rounded-xl w-full line-total bg-gray-100 text-blue-900 shadow-inner" readonly value="0.00"></td>
                <td class="first:rounded-l-xl last:rounded-r-xl p-2"><button type="button" class="text-red-500 remove-item font-bold">X</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="flex justify-center lg:justify-end"><button type="button" class="bg-gray-100 text-blue-900 px-6 py-2 rounded-xl shadow hover:shadow-md transition font-semibold hover:bg-green-300" id="add-item">Add Item</button></div>

        <!-- Summary: Total left (2/3) and bank details right (1/3) on large screens; stacked on small screens -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
          <div class="col-start-1 row-start-1 lg:col-span-2">
            <div class="space-y-4">
              <label class="block font-semibold">Total</label>
              <input type="text" id="total" name="total" class="w-full p-3 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300" readonly value="0">
            </div>
          </div>

          <div class="col-start-1 lg:col-start-3 row-start-2 lg:row-start-2 lg:justify-self-end">
            <div class="space-y-3 w-full">
              <div>
                <label class="block font-semibold text-sm">Account Holder Name</label>
                <input type="text" name="bank_account_holder" class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="e.g. ACME Ltd">
              </div>
              <div>
                <label class="block font-semibold text-sm">Account Number</label>
                <input type="text" name="bank_account_number" class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="12345678">
              </div>
              <div>
                <label class="block font-semibold text-sm">Sort Code</label>
                <input type="text" name="bank_sort_code" class="w-full p-2 rounded-xl bg-gray-100 text-blue-900 shadow-inner placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="12-34-56">
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-center"><button type="submit" class="sm:w-auto bg-gray-100 text-blue-900 px-8 py-3 rounded-xl shadow hover:shadow-md font-semibold transition hover:bg-green-300">Generate
            PDF</button></div>
      </form>
    </div>
    {% endblock %}

    {% block scripts %}
    <script src="http://127.0.0.1:5000/livereload.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    {% endblock %}
