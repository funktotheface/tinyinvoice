<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyInvoice - invoices in 60 seconds!</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-6">Create Your Invoice now</h1>
        <form action="/generate" method="POST" id="invoice-form">
            <!-- Business Info -->
            <div class="mb-4">
                <label class="block font-semibold">Your Business Name</label>
                <input type="text" name="business_name" class="w-full border p-2 rounded" required>
            </div>

            <div class="mb-4">
                <label class="block font-semibold">Client Name</label>
                <input type="text" name="client_name" class="w-full border p-2 rounded" required>
            </div>

            <div class="mb-4">
                <label class="block font-semibold">Invoice Date</label>
                <input type="date" name="invoice_date" class="w-full border p-2 rounded" required>
            </div>

            <!-- Items Table -->
            <h2 class="text-xl font-semibold mb-2">Items</h2>
            <table class="w-full mb-4" id="items-table">
                <thead>
                    <tr>
                        <th class="text-left">Description</th>
                        <th class="text-left">Quantity</th>
                        <th class="text-left">Price</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" name="item_description[]" class="border p-1 rounded" required></td>
                        <td><input type="number" name="item_quantity[]" class="border p-1 rounded" value="1" min="1"
                                required></td>
                        <td><input type="number" name="item_price[]" class="border p-1 rounded" value="0" min="0"
                                step="0.01" required></td>
                        <td><button type="button" class="text-red-500 remove-item">X</button></td>
                    </tr>
                </tbody>
            </table>

            <button type="button" id="add-item" class="bg-blue-500 text-white px-4 py-2 rounded mb-4">Add Item</button>

            <!-- Total -->
            <div class="mb-4">
                <label class="block font-semibold">Total</label>
                <input type="text" id="total" name="total" class="w-full border p-2 rounded" readonly value="0">
            </div>

            <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded">Generate PDF</button>
        </form>

    </div>

    <script>
        const addItemBtn = document.getElementById('add-item');
        const itemsTable = document.getElementById('items-table').querySelector('tbody');
        const totalField = document.getElementById('total');

        function updateTotal() {
            let total = 0;
            const quantities = document.getElementsByName('item_quantity[]');
            const prices = document.getElementsByName('item_price[]');

            for (let i = 0; i < quantities.length; i++) {
                total += parseFloat(quantities[i].value) * parseFloat(prices[i].value);
            }
            totalField.value = total.toFixed(2);
        }

        addItemBtn.addEventListener('click', () => {
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
    <td><input type="text" name="item_description[]" class="border p-1 rounded" required></td>
    <td><input type="number" name="item_quantity[]" class="border p-1 rounded" value="1" min="1" required></td>
    <td><input type="number" name="item_price[]" class="border p-1 rounded" value="0" min="0" step="0.01" required></td>
    <td><button type="button" class="text-red-500 remove-item">X</button></td>
  `;
            itemsTable.appendChild(newRow);
        });

        itemsTable.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-item')) {
                e.target.closest('tr').remove();
                updateTotal();
            }
        });

        itemsTable.addEventListener('input', updateTotal);
    </script>


</body>

</html>
