{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white/10 backdrop-blur p-8 rounded-2xl text-white">

  <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>

  <form method="POST" class="space-y-4">
    <input type="email" name="email" placeholder="Email" 
           class="w-full p-3 rounded bg-white/20 text-white" required>

    <input type="password" name="password" placeholder="Password" 
           class="w-full p-3 rounded bg-white/20 text-white" required>

    <button type="submit"
            class="w-full bg-white/20 hover:bg-white/30 py-2 rounded-xl font-semibold">
      Login
    </button>
  </form>

  <p class="mt-4 text-center text-gray-300">
    Need an account?  
    <a href="{{ url_for('auth.signup') }}" class="underline">Sign Up</a>
  </p>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cdnParticles.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
